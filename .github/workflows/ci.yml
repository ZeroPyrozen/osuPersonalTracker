name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned by commit: a moved tag cannot change what runs here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # NuGet audit runs as part of restore, transitive packages included. A known
      # vulnerability of moderate severity or worse fails the run rather than scrolling by.
      - name: Restore (with vulnerability audit)
        run: dotnet restore OsuPersonalTracker.slnx -warnaserror:NU1902,NU1903,NU1904

      - name: Build
        run: dotnet build OsuPersonalTracker.slnx --no-restore -warnaserror

      - name: Test
        run: dotnet test OsuPersonalTracker.slnx --no-build
